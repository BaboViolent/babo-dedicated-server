name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
        working-directory: server
      - run: cargo test --locked
        working-directory: server
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: zot.standouthost.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: zot.standouthost.com/standouthost/babo-dedicated-server:${{ github.ref_name }}
      - name: Update Argo CD image tag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/standouthost/clusters.git" clusters
          sed -i "s/tag: v.*/tag: ${RELEASE_TAG}/" clusters/clusters/k3s.soh.re/applications/babo-dedicated-server.yaml
          cd clusters
          git config user.name "babo-dedicated-server-release"
          git config user.email "actions@users.noreply.github.com"
          git add clusters/k3s.soh.re/applications/babo-dedicated-server.yaml
          git diff --cached --quiet || git commit -m "chore(babo-dedicated-server): deploy ${RELEASE_TAG}"
          git push
