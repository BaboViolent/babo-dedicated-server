name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
        working-directory: server
      - run: cargo test --locked
        working-directory: server
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image for vulnerability scan
        run: docker build --build-arg SERVER_VERSION=${{ github.ref_name }} --file server/Dockerfile --tag local/babo-dedicated-server:scan .
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: local/babo-dedicated-server:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - uses: docker/login-action@v4
        with:
          registry: zot.standouthost.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: image-metadata
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: zot.standouthost.com/baboviolent/babo-dedicated-server
          tags: type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.authors=BaboViolent contributors
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.title=Babo Dedicated Server
            org.opencontainers.image.description=Dedicated game server for Babo Violent 2
            org.opencontainers.image.vendor=BaboViolent
          annotations: |
            org.opencontainers.image.authors=BaboViolent contributors
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.title=Babo Dedicated Server
            org.opencontainers.image.description=Dedicated game server for Babo Violent 2
            org.opencontainers.image.vendor=BaboViolent
      - uses: docker/build-push-action@v7
        id: push-image
        with:
          context: .
          file: server/Dockerfile
          push: true
          # Zot requires image annotations on every manifest, including BuildKit's
          # unannotated default provenance artifact. Keep digest signing below.
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
          annotations: ${{ steps.image-metadata.outputs.annotations }}
          build-args: |
            SERVER_VERSION=${{ github.ref_name }}
      - name: Sign and verify published image
        uses: Jmainguy/notation-action@v1
        with:
          version: 1.3.2
          artifact: zot.standouthost.com/baboviolent/babo-dedicated-server@${{ steps.push-image.outputs.digest }}
          key-name: standouthost-oci
          private-key: ${{ secrets.NOTATION_PRIVATE_KEY }}
          certificate-chain: ${{ secrets.NOTATION_CERTIFICATE_CHAIN }}
          ca-certificate: ${{ secrets.NOTATION_CA_CERTIFICATE }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Update Argo CD image tag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/standouthost/clusters.git" clusters
          sed -i "s/tag: v[^,[:space:]]*/tag: ${RELEASE_TAG}/" clusters/clusters/k3s.soh.re/applications/babo-dedicated-server*.yaml
          cd clusters
          git config user.name "babo-dedicated-server-release"
          git config user.email "actions@users.noreply.github.com"
          git add clusters/k3s.soh.re/applications/babo-dedicated-server*.yaml
          git diff --cached --quiet || git commit -m "chore(babo-dedicated-server): deploy ${RELEASE_TAG}"
          git push
