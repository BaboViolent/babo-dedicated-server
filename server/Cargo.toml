[package]
name = "bv2-server"
version = "0.1.0"
edition = "2021"
description = "BaboViolent 2 WebSocket dedicated server for jsclient"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
